name: Daily English Bombardment

on:
  schedule:
    # 24 times a day (every hour at minute 23 to avoid :00 queue drops)
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-bombardment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run English Bombardment Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python3 bot.py

      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update learning state [skip ci]"
          git push
