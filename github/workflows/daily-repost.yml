name: daily-repost

on:
  schedule:
    # ساعت ۱۵:۰۰ UTC = حدود ۱۸:۳۰ به وقت تهران
    - cron: "0 15 * * *"
  workflow_dispatch:   # برای اجرای دستی و تست

permissions:
  contents: write      # برای ذخیره‌ی state.json

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python repost.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          MAX_ID: ${{ vars.MAX_ID }}

      - name: Save state
        if: always()
        run: |
          git config user.name "repost-bot"
          git config user.email "repost-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
